name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    name: Validation (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Prettier check
        run: npm run format:check

      - name: Run Unit Tests
        run: npm run test

      - name: Build Next.js App
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          AUTH_SECRET: ci-test-secret-value-must-be-long-enough

      - name: Accessibility Check (axe-core)
        run: |
          echo "Phase 1: CI pipeline established."
          echo "Full accessibility check (axe) deferred to Phase 2 UI implementation."
